<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Spinner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100vh;
            background: #1a1a1a;
            font-family: 'Arial', sans-serif;
        }

        .book-spinner {
            width: 300px;
            height: 300px;
            perspective: 1000px;
        }

        .book {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            animation: spin 12s infinite linear;
        }

        @keyframes spin {
            from {
                transform: rotateY(0deg);
            }
            to {
                transform: rotateY(360deg);
            }
        }

        .book-face {
            position: absolute;
            width: 300px;
            height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
            font-weight: bold;
            color: white;
            border: 3px solid rgba(0, 0, 0, 0.3);
            backface-visibility: hidden;
        }

        .face1 {
            background: #FF0000;
            transform: rotateY(0deg) translateZ(150px);
        }

        .face2 {
            background: #FF7F00;
            transform: rotateY(60deg) translateZ(150px);
        }

        .face3 {
            background: #FFFF00;
            transform: rotateY(120deg) translateZ(150px);
        }

        .face4 {
            background: #00AA00;
            transform: rotateY(180deg) translateZ(150px);
        }

        .face5 {
            background: #0000FF;
            transform: rotateY(240deg) translateZ(150px);
        }

        .face6 {
            background: #9400D3;
            transform: rotateY(300deg) translateZ(150px);
        }
    </style>
</head>
<body>
    <div class="book-spinner">
        <div class="book">
            <div class="book-face face1">1</div>
            <div class="book-face face2">2</div>
            <div class="book-face face3">3</div>
            <div class="book-face face4">4</div>
            <div class="book-face face5">5</div>
            <div class="book-face face6">6</div>
        </div>
    </div>
</body>
</html>
